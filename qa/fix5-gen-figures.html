<!doctype html>
<!-- qa/fix5-gen-figures.html — fix5 lane "gen" dev page (NOT served; never copied under site/). Renders T-notation
     mini-figures and T-vocab stems at phone width. Serve the REPO ROOT; ?set=a|b|c|d picks a batch (see CASES).
     node qa/fix5-gen-walk.mjs dev <tag> [--dark] [--set a] shoots it and prints window.__report. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>fix5 gen figures</title>
<link rel="stylesheet" href="../site/css/theme.css">
<link rel="stylesheet" href="../site/css/figure.css">
<link rel="stylesheet" href="../site/css/polish.css">
<style>
  body { margin: 0; padding: 8px 16px; background: var(--bg, #F6F8FC); color: var(--text, #0F1728); font-family: var(--font-ui, system-ui, sans-serif); }
  .card { background: var(--surface, #fff); border: 1px solid var(--line, #D8DFEC); border-radius: 12px; padding: 6px 8px; margin-bottom: 6px; }
  .stem { font-size: 13px; margin: 2px 0 4px; line-height: 1.3; }
  .tag { font: 11px var(--font-mono, monospace); color: var(--muted, #5B6780); }
  .paper { background: var(--paper, #FBFAF5); border-radius: 8px; }
  .fig { display: block; width: 100%; height: auto; }
  .bad { color: var(--bad, #c00); font: 11px monospace; }
</style>
</head>
<body>
<div id="out"></div>
<script type="module">
  import { generate } from '../site/data/templates.js';
  import { render, lint } from '../site/js/figure/svg.js';
  import { resolve, validate } from '../site/js/figure/model.js';
  const set = new URLSearchParams(location.search).get('set') || 'a';
  const CASES = {
    a: [['ray', 'q1'], ['ray', 'q2'], ['ray', 'q3'], ['line', 'q4']],
    b: [['line', 'q5'], ['seg', 'q6'], ['len', 'q7'], ['ang', 'q8']],
    c: [['ang', 'q9'], ['m', 'q10'], ['plane', 'q11'], ['plane', 'q12']],
    d: [['cong', 'q13'], ['eq', 'q14'], [null, 'q15'], [null, 'q16']],
    v: 'vocab',
  };
  const out = document.getElementById('out');
  const report = [];
  const sets = set === 'v' ? [] : CASES[set];
  for (const [kind, seed0] of sets) {
    // a forced plane may name its plane by one letter (no figure): walk seeds to a figure item
    let it = null;
    for (let i = 0; i < 40 && !(it && it.figure); i++) it = generate('T-notation', `${seed0}${i ? '-' + i : ''}`, kind ? { kind } : {});
    const card = document.createElement('div'); card.className = 'card';
    const m = it.figure ? resolve(it.figure.spec, it.figure) : null;
    const issues = m ? [...validate(m), ...lint(m, { widthPx: 343 })] : ['no figure'];
    card.innerHTML = `<div class="tag">${it.id} · ${it.params.kind} · ${JSON.stringify(it.params.answer.pts)}</div><div class="stem">${it.stem.replace(/[<>]/g, '')}</div>`;
    const paper = document.createElement('div'); paper.className = 'paper';
    if (it.figure) paper.innerHTML = render(it.figure.spec, it.figure);
    card.append(paper);
    if (issues.length) { const b = document.createElement('div'); b.className = 'bad'; b.textContent = issues.join(' | '); card.append(b); }
    out.append(card);
    report.push({ id: it.id, kind: it.params.kind, issues, svg: paper.querySelector('svg') });
  }
  if (set === 'v') {
    for (let i = 0; i < 8; i++) {
      const it = generate('T-vocab', `v${i}`, { mode: ['mc-def', 'mc-term', 'type', 'match'][i % 4] });
      const card = document.createElement('div'); card.className = 'card';
      card.innerHTML = `<div class="tag">${it.id} · ${it.params.mode} · figure ${it.figure ? 'yes' : 'none'}</div><div class="stem">${it.stem.replace(/[<>]/g, '')}</div>`;
      out.append(card);
      report.push({ id: it.id, mode: it.params.mode, figure: !!it.figure, mentionsFigure: /figure/i.test(it.stem), issues: [] });
    }
  }
  await document.fonts?.ready;
  // DOM measure: letters inside the svg box, no two letters overlapping
  for (const r of report) {
    if (!r.svg) { delete r.svg; continue; }
    const box = r.svg.getBoundingClientRect();
    const L = [...r.svg.querySelectorAll('.fig-label')].map((t) => ({ t: t.textContent, b: t.getBoundingClientRect() }));
    r.clipped = L.filter(({ b }) => b.left < box.left - 0.5 || b.right > box.right + 0.5 || b.top < box.top - 0.5 || b.bottom > box.bottom + 0.5).map((x) => x.t);
    r.overlap = [];
    for (let i = 0; i < L.length; i++) for (let j = i + 1; j < L.length; j++) { const a = L[i].b, b = L[j].b; if (a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom) r.overlap.push(L[i].t + '/' + L[j].t); }
    r.letters = L.map((x) => x.t).join('');
    r.w = Math.round(box.width);
    delete r.svg;
  }
  window.__report = report;
</script>
</body>
</html>
