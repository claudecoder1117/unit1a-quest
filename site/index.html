<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="build" content="2026-09-16a">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F8FC" data-default="#F6F8FC">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0F17" data-default="#0B0F17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Packet">
  <title>The Packet</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/figure.css">
  <link rel="stylesheet" href="css/motion.css">
  <link rel="stylesheet" href="css/widgets.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/polish.css">
  <link rel="stylesheet" href="css/job.css">
  <script>
    // Apply the saved theme before first paint (no flash). Mirrors app.js applyTheme(); harmless if it fails.
    try {
      var t = JSON.parse(localStorage.getItem('u1a.save') || '{}').settings?.theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="hdr" role="banner">
    <div class="hdr-inner">
      <div class="hdr-left">
        <a class="hdr-home" href="#/today" aria-label="Home">
          <span id="hdr-readiness" class="ring ring-readiness" role="img" aria-label="Readiness: not scored yet" data-provisional="true">
            <svg viewBox="0 0 36 36" aria-hidden="true"><circle class="ring-track" cx="18" cy="18" r="16"/><circle class="ring-fill" cx="18" cy="18" r="16" stroke-dasharray="100.53" stroke-dashoffset="100.53" data-empty="true"/></svg>
            <span class="ring-num">—</span>
          </span>
        </a>
        <a id="hdr-tminus" class="chip" href="#/settings" hidden>T−?</a>
      </div>
      <div class="hdr-right">
        <span id="hdr-level" class="ring ring-level" role="img" aria-label="Level 1 Point">
          <svg viewBox="0 0 28 28" aria-hidden="true"><circle class="ring-track" cx="14" cy="14" r="12"/><circle class="ring-fill" cx="14" cy="14" r="12" stroke-dasharray="75.4" stroke-dashoffset="75.4" data-empty="true"/></svg>
          <span class="ring-num">1</span>
        </span>
        <span id="hdr-xp" class="hdr-xp">0 XP</span>
        <span id="hdr-combo" class="combo" data-tier="0" role="img" aria-label="Combo 0"><span class="combo-pip"></span><span class="combo-n"></span></span>
        <span id="hdr-streak" class="streak" data-count="0" role="img" aria-label="Streak 0 days">
          <svg viewBox="0 0 28 20" aria-hidden="true"><path class="arc-track" d="M 2 18 A 12 12 0 0 1 26 18"/><path class="arc-fill" d=""/><line class="arc-base" x1="0" y1="18" x2="28" y2="18"/></svg>
          <span class="streak-n">0</span>
        </span>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch theme">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </button>
      </div>
    </div>
  </header>
  <div id="banner" role="status" aria-live="polite" hidden><div class="banner-inner"></div></div>
  <main id="view" tabindex="-1" aria-live="off"></main>
  <div id="dock" class="dock" hidden><div class="dock-inner"></div></div>
  <noscript><p style="padding:24px">The Packet needs JavaScript (it grades and saves locally; nothing is sent anywhere).</p></noscript>
  <script src="version.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
